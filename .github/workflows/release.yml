name: release

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PROSVET_REPO: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: { go-version: "1.27.x" }
      - run: go vet ./internal/... ./cmd/prosvet
      - run: GOOS=windows go vet ./internal/... ./cmd/prosvet
      - run: go test ./internal/...

  linux:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: { go-version: "1.27.x" }
      - name: version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "PROSVET_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - run: scripts/build.sh linux
      - run: rm -f dist/SHA256SUMS
      - uses: actions/upload-artifact@v5
        with: { name: linux, path: dist/* }

  windows:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: { go-version: "1.27.x" }
      - name: version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "PROSVET_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - run: scripts/build.sh windows
      - run: rm -f dist/SHA256SUMS
      - uses: actions/upload-artifact@v5
        with: { name: windows, path: dist/* }

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: { go-version: "1.27.x" }
      - uses: actions/download-artifact@v5
        with: { path: dist, merge-multiple: true }
      - run: cd dist && rm -f SHA256SUMS* && sha256sum * > SHA256SUMS
      - name: sign SHA256SUMS (installed copies refuse unsigned updates)
        env:
          PROSVET_SIGNING_KEY: ${{ secrets.PROSVET_SIGNING_KEY }}
        run: go run ./tools/sign dist/SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
